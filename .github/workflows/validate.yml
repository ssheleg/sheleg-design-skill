name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate repo consistency
        run: python3 test/validate.py
      - name: Validator negative self-test (must FAIL on corrupted version)
        run: |
          cp -R . /tmp/corrupted
          sed -i 's/"version": "[0-9.]*"/"version": "9.9.9"/' /tmp/corrupted/package.json
          if python3 /tmp/corrupted/test/validate.py; then
            echo "validator failed to fail on a version mismatch" >&2; exit 1
          fi
      - name: Validator negative control (must FAIL on a stripped reduced-motion branch)
        run: |
          set -eu
          # "Degrade to calm" is a stated principle, and until B-040 the only thing
          # reading it was a string assertion over MOTION_DOCTRINE.md -- so two of
          # twenty-nine token layers shipped no branch at all with every gate green.
          # The block is stripped from the token layer AND from the kit copy, because
          # a kit carries its pack's token layer byte for byte: strip only one and the
          # run goes red on kit drift, which would pass this step while proving
          # nothing. The message is grepped for the same reason.
          rm -rf /tmp/nomotion && cp -R . /tmp/nomotion
          for f in \
            /tmp/nomotion/plugins/sheleg-design/skills/sheleg-design/styles/tokens/instrument-console.css \
            /tmp/nomotion/.cursor/skills/sheleg-design/styles/tokens/instrument-console.css \
            /tmp/nomotion/kits/instrument-console/src/styles.css; do
            perl -0pi -e 's/\@media \(prefers-reduced-motion: reduce\) \{\n  :root \{/  :root {/' "$f"
          done
          if python3 /tmp/nomotion/test/validate.py > /tmp/nomotion.log 2>&1; then
            echo "validator failed to fail on a token layer with no reduced-motion branch" >&2
            exit 1
          fi
          grep -q "ships no '@media (prefers-reduced-motion: reduce)' branch" /tmp/nomotion.log || {
            echo "validator went red for some other reason -- the reduced-motion check did not fire" >&2
            cat /tmp/nomotion.log >&2; exit 1
          }

      - name: Palette gate (claimed ratios re-derived; separation under CVD)
        run: python3 test/validate_palette.py
      - name: Slop lint (the skill is held to its own bans)
        run: python3 test/sloplint.py
      - name: Gate self-tests (every gate watched failing on a planted defect)
        run: |
          python3 test/validate.py --self-test
          python3 test/validate_palette.py --self-test
          python3 test/sloplint.py --self-test
      - name: Unknown arguments must be refused, not silently ignored
        run: |
          for g in validate validate_palette sloplint; do
            if python3 "test/$g.py" --nonsense-flag; then
              echo "$g.py accepted an unknown flag and ran the normal pass" >&2; exit 1
            fi
          done
      - name: CLI syntax check
        run: node --check bin/cli.js
      - name: CLI help smoke test
        run: npm run smoke
      - name: CLI smoke test (npx channel installs the whole bundle)
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          node "$GITHUB_WORKSPACE/bin/cli.js" --claude
          diff -r \
            "$GITHUB_WORKSPACE/plugins/sheleg-design/skills/sheleg-design" \
            .claude/skills/sheleg-design
      - name: POSIX installer smoke test (same bundle, no Node)
        run: |
          mkdir -p /tmp/smoke-sh && cd /tmp/smoke-sh
          sh "$GITHUB_WORKSPACE/install.sh" ./skill
          diff -r \
            "$GITHUB_WORKSPACE/plugins/sheleg-design/skills/sheleg-design" \
            ./skill
      - name: Official Claude Code conformance (plugin + marketplace, strict)
        run: |
          set -eu
          # The repo's own validator enforces house rules; this one is the
          # upstream spec. --strict fails on unrecognized manifest fields and on
          # front matter that silently drops at runtime -- both were real here.
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/sheleg-design --strict
      - name: Reference kit materializes (--kit is not the installer)
        run: |
          set -eu
          node bin/cli.js --kit workbench --out /tmp/kit
          # guidelines/ is materialized here and committed nowhere, so it is the
          # one path that must differ -- see the design spec, section 9. dist/
          # and node_modules/ are excluded for the same reason --kit skips them:
          # they are absent on a fresh checkout and present for anyone who has
          # built locally, and a check that only passes on CI teaches people to
          # ignore it.
          diff -r --exclude=guidelines --exclude=dist --exclude=node_modules \
            kits/workbench /tmp/kit
          diff plugins/sheleg-design/skills/sheleg-design/styles/workbench.md \
               /tmp/kit/guidelines/workbench.md
          # A kit that reached the bundle would be installed into every project,
          # which ADR-0002 exists to prevent.
          test -z "$(find plugins/sheleg-design/skills/sheleg-design -name 'package.json' -o -name '*.tsx')"

  # The kit list is derived, never typed. A hand-maintained matrix is a list that
  # must be kept in sync by a human, and the seventh kit proved it isn't: it was
  # built, green and invisible to CI until someone noticed the matrix said six.
  discover-kits:
    runs-on: ubuntu-latest
    outputs:
      packs: ${{ steps.list.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          set -eu
          packs=$(ls -1 kits | jq -R . | jq -sc .)
          echo "packs=$packs" >> "$GITHUB_OUTPUT"
          echo "kits under test: $packs"

  kits:
    needs: discover-kits
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.discover-kits.outputs.packs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the kit's build deps
        working-directory: kits/${{ matrix.pack }}
        run: npm install --no-save typescript@^5.6.0 @types/react@^18.3.0 react@^18.3.0
      - name: Build
        working-directory: kits/${{ matrix.pack }}
        run: npm run build
      - name: Emitted something
        working-directory: kits/${{ matrix.pack }}
        # tsc exits 0 when `include` matches nothing, so "the build passed"
        # would be true and useless without this line.
        run: test -s dist/index.js && test -s dist/index.d.ts
